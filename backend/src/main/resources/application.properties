spring.application.name=grano-backend
grano.cuentas-demo.enabled=${GRANO_CUENTAS_DEMO:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.address=${GRANO_BACKEND_ADDRESS:127.0.0.1}
server.port=${GRANO_BACKEND_PORT:8080}

# La base queda en backend/data al ejecutar desde la carpeta backend.
spring.datasource.url=${GRANO_DB_URL:jdbc:h2:file:./data/grano}
spring.datasource.username=${GRANO_DB_USER:sa}
spring.datasource.password=${GRANO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false

# Permitimos los dos nombres locales que usamos al abrir Vite.
grano.frontend.origins=${GRANO_FRONTEND_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
